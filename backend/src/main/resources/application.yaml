server:
  port: ${PORT:8080}

spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:file:./data/zemodb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
